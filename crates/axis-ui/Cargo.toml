[package]
name = "axis-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "axis-ui"
path = "src/main.rs"

[dependencies]
axis-protocol = { path = "../axis-protocol" }
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
windows-sys.workspace = true

[build-dependencies]
slint-build = "1.18"
