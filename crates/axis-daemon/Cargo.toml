[package]
name = "axis-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "axis"
path = "src/main.rs"

[dependencies]
axis-core = { path = "../axis-core" }
axis-protocol = { path = "../axis-protocol" }
serde.workspace = true
toml.workspace = true
axis-devices = { path = "../axis-devices" }
axis-virtual = { path = "../axis-virtual" }
log.workspace = true
hidapi.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Pipes"] }
